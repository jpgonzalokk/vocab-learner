spring:
  main:
    web-application-type: none   # es una app de linea de comandos, sin servidor web
    banner-mode: off
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 8192

logging:
  level:
    root: WARN
    com.vocablearner: INFO
